<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Article Title</title>

  <!-- Open Graph Meta Tags ( WhatsApp Reads These First ) -->
  <meta property="og:site_name" content="Swasti Math">
  <meta property="og:title" content="Your Article Title">
  <meta property="og:description" content="Your brief article excerpt or summary goes here.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://swasti-math.github.io/posts/0001/index.html">

  <!-- Fallback standard HTML meta description -->
  <meta name="description" content="Your brief article excerpt or summary goes here.">
  <link rel="canonical" href="https://swasti-math.github.io/posts/0001/index.html">
</head>
<body>
  <h1>Your Article Title</h1>
  <p>Your brief article excerpt or summary goes here.</p>

  <!-- Redirect script delayed slightly so scrapers do not follow it -->
  <script>
    setTimeout(function() {
      const targetHash = "#post/0001";
      const basePath = window.location.pathname.replace(/\/posts\/.*/, '/');
      window.location.href = window.location.origin + basePath + targetHash;
    }, 100);
  </script>
</body>
</html>
